# kodi-rt meson cross file: Windows ARM32 with rt2.4 0549949d (clang-cl, lld-link, llvm-lib), /MT.
# SDK split (Hamed, 2026-11-12): headers 10.0.26100.0, ARM32 import libraries 10.0.19041.0.
# With clang-cl and meson >= 0.58, dav1d assembles its GAS .S NEON files with clang-cl itself (no gas-preprocessor).
# The linker: meson's clang-cl detection runs a bare "lld-link" from PATH (c_ld is not used for that), so the caller
# must put F:/kodi-rt/tc/rt24b-cr/bin first on PATH.
[binaries]
c = ['F:/kodi-rt/tc/rt24b-cr/bin/clang-cl.exe', '--target=armv7-pc-windows-msvc', '-vctoolsdir', 'D:/Program Files/vs22buildtools/VC/Tools/MSVC/14.44.35207', '-winsdkdir', 'D:/Windows Kits/10', '-winsdkversion', '10.0.26100.0']
cpp = ['F:/kodi-rt/tc/rt24b-cr/bin/clang-cl.exe', '--target=armv7-pc-windows-msvc', '-vctoolsdir', 'D:/Program Files/vs22buildtools/VC/Tools/MSVC/14.44.35207', '-winsdkdir', 'D:/Windows Kits/10', '-winsdkversion', '10.0.26100.0']
ar = 'F:/kodi-rt/tc/rt24b-cr/bin/llvm-lib.exe'
windres = 'F:/kodi-rt/tc/rt24b-cr/bin/llvm-rc.exe'
strip = 'F:/kodi-rt/tc/rt24b-cr/bin/llvm-strip.exe'
# for dependency(..., method: 'cmake'): a cross build takes cmake from here, not from PATH
cmake = 'D:/Program Files/vs22buildtools/Common7/IDE/CommonExtensions/Microsoft/CMake/CMake/bin/cmake.exe'

[built-in options]
c_link_args = ['/libpath:D:/Program Files/vs22buildtools/VC/Tools/MSVC/14.44.35207/lib/arm', '/libpath:D:/Windows Kits/10/Lib/10.0.19041.0/ucrt/arm', '/libpath:D:/Windows Kits/10/Lib/10.0.19041.0/um/arm']
cpp_link_args = ['/libpath:D:/Program Files/vs22buildtools/VC/Tools/MSVC/14.44.35207/lib/arm', '/libpath:D:/Windows Kits/10/Lib/10.0.19041.0/ucrt/arm', '/libpath:D:/Windows Kits/10/Lib/10.0.19041.0/um/arm']
b_vscrt = 'mt'

[host_machine]
system = 'windows'
cpu_family = 'arm'
cpu = 'armv7'
endian = 'little'
