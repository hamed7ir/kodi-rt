# kodi-rt meson NATIVE file: x64 host tools built on this server (pkgconf for Kodi's configure), rt2.4 clang-cl for
# x86_64-pc-windows-msvc, MSVC 14.44, SDK 10.0.26100.0 (headers and x64 libs), static CRT. The x64 twin of
# cross/x64-host-rt24.cmake. meson's clang-cl detection runs a bare "lld-link" from PATH: put
# F:/kodi-rt/tc/rt24c-cr/bin first on PATH.
[binaries]
c = ['F:/kodi-rt/tc/rt24c-cr/bin/clang-cl.exe', '--target=x86_64-pc-windows-msvc', '-vctoolsdir', 'D:/Program Files/vs22buildtools/VC/Tools/MSVC/14.44.35207', '-winsdkdir', 'D:/Windows Kits/10', '-winsdkversion', '10.0.26100.0']
cpp = ['F:/kodi-rt/tc/rt24c-cr/bin/clang-cl.exe', '--target=x86_64-pc-windows-msvc', '-vctoolsdir', 'D:/Program Files/vs22buildtools/VC/Tools/MSVC/14.44.35207', '-winsdkdir', 'D:/Windows Kits/10', '-winsdkversion', '10.0.26100.0']
ar = 'F:/kodi-rt/tc/rt24c-cr/bin/llvm-lib.exe'
windres = 'F:/kodi-rt/tc/rt24c-cr/bin/llvm-rc.exe'

[built-in options]
c_link_args = ['/libpath:D:/Program Files/vs22buildtools/VC/Tools/MSVC/14.44.35207/lib/x64', '/libpath:D:/Windows Kits/10/Lib/10.0.26100.0/ucrt/x64', '/libpath:D:/Windows Kits/10/Lib/10.0.26100.0/um/x64']
cpp_link_args = ['/libpath:D:/Program Files/vs22buildtools/VC/Tools/MSVC/14.44.35207/lib/x64', '/libpath:D:/Windows Kits/10/Lib/10.0.26100.0/ucrt/x64', '/libpath:D:/Windows Kits/10/Lib/10.0.26100.0/um/x64']
b_vscrt = 'mt'
