## kodi-rt: an OpenSSL build target for DESKTOP Windows ARM32 (Windows RT 8.1) with rt2.4 0549949d.
## OpenSSL's own "VC-WIN32-ARM" (Configurations/50-win-onecore.conf) is a OneCore target: it defines
## OPENSSL_SYS_WIN_CORE, links onecore.lib and drops kernel32.lib, i.e. Windows 10 API sets. This target is the plain
## desktop VC base ("VC-noCE-common": ws2_32 gdi32 advapi32 crypt32 user32) with VC-WIN32-ARM's ARM32 bn_ops and
## multilib, and rt2.4's clang-cl / lld-link / llvm-lib through kodi-rt's response files (SDK headers 10.0.26100.0,
## ARM32 import libraries 10.0.19041.0). Use with: perl Configure VC-WIN32-ARM-kodirt --config=<this file> no-asm ...
my %targets = (
    "VC-WIN32-ARM-kodirt" => {
        inherit_from    => [ "VC-noCE-common" ],
        CC              => "F:/kodi-rt/tc/rt24b-cr/bin/clang-cl.exe",
        CFLAGS          => add('@F:/kodi-rt/cross/arm32-msvc.rsp'),
        LD              => "F:/kodi-rt/tc/rt24b-cr/bin/lld-link.exe",
        LDFLAGS         => add('@F:/kodi-rt/cross/arm32-link.rsp'),
        AR              => "F:/kodi-rt/tc/rt24b-cr/bin/llvm-lib.exe",
        RC              => "F:/kodi-rt/tc/rt24b-cr/bin/llvm-rc.exe",
        defines         => add("_ARM_WINAPI_PARTITION_DESKTOP_SDK_AVAILABLE"),
        bn_ops          => "BN_LLONG RC4_CHAR",
        multilib        => "-arm",
    },
);
