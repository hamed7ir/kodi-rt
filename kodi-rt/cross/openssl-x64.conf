## kodi-rt: an OpenSSL build target for desktop Windows x64: OpenSSL's own VC-WIN64A with rt2.4 f6e5f8e0's
## clang-cl / lld-link / llvm-lib through kodi-rt's response files (SDK 10.0.26100.0). Generated by cross/gen-arch-files.py; edit that, not this.
## Use with: perl Configure VC-WIN64A-kodirt --config=<this file> no-asm ...   (no-asm: OpenSSL's x86 assembly needs
## nasm, which is not on this server)
my %targets = (
    "VC-WIN64A-kodirt" => {
        inherit_from    => [ "VC-WIN64A" ],
        CC              => "F:/kodi-rt/tc/rt24d-cr/bin/clang-cl.exe",
        CFLAGS          => add('@F:/kodi-rt/cross/x64-target-msvc.rsp'),
        LD              => "F:/kodi-rt/tc/rt24d-cr/bin/lld-link.exe",
        LDFLAGS         => add('@F:/kodi-rt/cross/x64-target-link.rsp'),
        AR              => "F:/kodi-rt/tc/rt24d-cr/bin/llvm-lib.exe",
        RC              => "F:/kodi-rt/tc/rt24d-cr/bin/llvm-rc.exe",
    },
);
